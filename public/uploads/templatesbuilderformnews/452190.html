<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style type="text/css">
        body { margin: 0; padding: 0; min-width: 100%; }
        table { border-collapse: collapse; border-spacing: 0; }
        td { padding: 0; vertical-align: top; }
        .spacer, .border { font-size: 1px; line-height: 1px; }
        .spacer { width: 100%; }
        img { border: 0; -ms-interpolation-mode: bicubic; }
        .image { display: block; margin: 0; }
        .gold-elegant {
            border: 3px solid #FFD700;
            box-shadow: 0 0 0 1px #FFA500 inset;
        }

        .gold-royal {
            border: 4px double #FFD700;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .gold-ornate {
            border: 2px solid #FFD700;
            box-shadow:
                inset 0 0 0 6px white,
                inset 0 0 0 8px #FFD700,
                0 0 20px rgba(255, 215, 0, 0.4);
        }

        .gold-gradient {
            border: 4px solid transparent;
            background: linear-gradient(white, white) padding-box,
                linear-gradient(135deg, #FFD700, #FFA500, #FF8C00, #FFD700) border-box;
            animation: gradientRotate 4s linear infinite;
            background-size: 200% 200%;
        }

        .gold-vintage {
            border: 3px ridge #FFD700;
            box-shadow:
                0 0 0 1px #B8860B,
                0 5px 15px rgba(184, 134, 11, 0.3);
        }

        .gold-luxury {
            border: 5px solid #FFD700;
            border-image: linear-gradient(45deg, #FFD700, #FFA500, #FFD700) 1;
            box-shadow:
                inset 0 0 20px rgba(255, 215, 0, 0.1),
                0 0 30px rgba(255, 215, 0, 0.3);
        }

        .corner-art {
            position: relative;
            border: 2px solid #ddd;
        }

        .corner-art::before,
        .corner-art::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #FFD700;
        }

        .corner-art::before {
            top: -4px;
            left: -4px;
            border-right: none;
            border-bottom: none;
        }

        .corner-art::after {
            bottom: -4px;
            right: -4px;
            border-left: none;
            border-top: none;
        }

        .art-deco {
            border: 3px solid #FFD700;
            position: relative;
            background: white;
        }

        .art-deco::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid #FFD700;
            pointer-events: none;
        }

        .art-deco::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px dashed #FFD700;
            pointer-events: none;
        }

        .neon-glow {
            border: 3px solid #FFD700;
            box-shadow:
                0 0 10px #FFD700,
                0 0 20px #FFD700,
                0 0 30px #FFD700,
                inset 0 0 10px rgba(255, 215, 0, 0.2);
            animation: neonPulse 2s ease-in-out infinite;
        }

        .diamond-pattern {
            border: 4px solid #FFD700;
            position: relative;
            background:
                repeating-linear-gradient(45deg,
                    transparent,
                    transparent 10px,
                    rgba(255, 215, 0, 0.1) 10px,
                    rgba(255, 215, 0, 0.1) 20px);
        }

        .embossed {
            border: 3px solid #B8860B;
            box-shadow:
                -2px -2px 4px rgba(255, 215, 0, 0.5),
                2px 2px 4px rgba(0, 0, 0, 0.3),
                inset -1px -1px 2px rgba(255, 215, 0, 0.3),
                inset 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .celtic-knot {
            border: 4px solid #FFD700;
            position: relative;
        }

        .celtic-knot::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            transform: translate(-50%, -50%) rotate(45deg);
            border: 2px dashed #FFD700;
            pointer-events: none;
        }

        .moroccan {
            border: 3px solid #FFD700;
            position: relative;
            background:
                radial-gradient(circle at 0% 0%, rgba(255, 215, 0, 0.1) 10px, transparent 11px),
                radial-gradient(circle at 100% 0%, rgba(255, 215, 0, 0.1) 10px, transparent 11px),
                radial-gradient(circle at 0% 100%, rgba(255, 215, 0, 0.1) 10px, transparent 11px),
                radial-gradient(circle at 100% 100%, rgba(255, 215, 0, 0.1) 10px, transparent 11px),
                white;
        }

        .beveled-gold {
            border: none;
            box-shadow:
                inset 3px 3px 6px rgba(255, 215, 0, 0.8),
                inset -3px -3px 6px rgba(184, 134, 11, 0.8),
                3px 3px 6px rgba(0, 0, 0, 0.2);
            background: linear-gradient(145deg, #FFD700, #FFA500);
        }

        .ribbon-border {
            border: none;
            position: relative;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .ribbon-border::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg,
                    #FFD700 0%, #FFD700 25%,
                    #FFA500 25%, #FFA500 50%,
                    #FFD700 50%, #FFD700 75%,
                    #FFA500 75%, #FFA500 100%);
            background-size: 40px 100%;
        }

        .ribbon-border::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg,
                    #FFD700 0%, #FFD700 25%,
                    #FFA500 25%, #FFA500 50%,
                    #FFD700 50%, #FFD700 75%,
                    #FFA500 75%, #FFA500 100%);
            background-size: 40px 100%;
        }

        @keyframes gradientRotate {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes neonPulse {

            0%,
            100% {
                box-shadow:
                    0 0 10px #FFD700,
                    0 0 20px #FFD700,
                    0 0 30px #FFD700,
                    inset 0 0 10px rgba(255, 215, 0, 0.2);
            }

            50% {
                box-shadow:
                    0 0 20px #FFD700,
                    0 0 30px #FFD700,
                    0 0 40px #FFD700,
                    inset 0 0 15px rgba(255, 215, 0, 0.3);
            }
        }

        @media only screen and (max-width: 600px) {
            table[class="container"] {
                width: 100% !important;
            }

            td[class="mobile-block"] {
                display: block !important;
                width: 100% !important;
                box-sizing: border-box;
            }

            img[class="mobile-img"] {
                width: 100% !important;
                height: auto !important;
            }

            td[class="mobile-pad"] {
                padding-left: 20px !important;
                padding-right: 20px !important;
            }
        }
    </style>
</head>
